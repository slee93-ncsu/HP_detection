# Describe your meter data layout. Only change what differs from the defaults.
# Defaults match the training data: kWh per interval, degrees C,
# timestamps at the end of each interval, local standard time.

format: long                    # long (one table) | resstock (parquet per building)

id_column: meter_id
timestamp_column: read_time
load_column: usage
load_unit: kWh                  # kWh (default, training) | Wh | kW (average demand over the interval)
timestamp_convention: end       # end (default, training) | start: which end of the interval the timestamp marks
timezone: null                  # e.g. America/Chicago; required if timestamps carry a UTC offset

# Temperature: either a column in the meter table ...
temp_column: null
temp_unit: C                    # C (default, training) | F; applies to temp_column and weather_file

# ... or a separate weather file.
weather_file: weather.csv
weather_timestamp_column: timestamp
weather_temp_column: temp_c
weather_key_column: null        # e.g. station_id, if the weather file has several stations
